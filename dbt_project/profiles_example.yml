# Copy this into ~/.dbt/profiles.yml (or merge with your existing one).
# Requires GCP_PROJECT_ID and GOOGLE_APPLICATION_CREDENTIALS to be set as
# environment variables (see .env.example).

churn_pipeline:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_MARTS_DATASET', 'olist_marts') }}"
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      threads: 4
      timeout_seconds: 300
      location: US
      priority: interactive

    ci:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "ci_{{ env_var('BQ_MARTS_DATASET', 'olist_marts') }}"
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      threads: 4
      timeout_seconds: 300
      location: US
      priority: interactive
